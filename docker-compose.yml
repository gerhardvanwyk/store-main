version: '3.8'
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5433/store
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  reset-sequences:
    image: postgres:16.2
    depends_on:
      app:
        condition: service_healthy
    environment:
      PGPASSWORD: admin
    volumes:
      - ./docker/reset-sequences.sql:/sql/reset-sequences.sql:ro
    command: >
      sh -c "
      echo 'Application is healthy. Resetting PostgreSQL sequences...';
      psql -h app -p 5433 -U admin -d store -f /sql/reset-sequences.sql;
      echo 'PostgreSQL sequences reset complete.';
      "
    restart: "no"
